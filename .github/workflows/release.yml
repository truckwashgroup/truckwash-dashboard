name: Release publiceren

# Zet een versietag en deze workflow bouwt de Windows-installer en de
# Android-APK, en hangt ze onder Releases op GitHub. Daar downloadt de
# geïnstalleerde Windows-app ook zijn updates vandaan.
#
#   npm version 1.0.1 --no-git-tag-version   (past package.json aan)
#   git commit -am "Versie 1.0.1"
#   git tag v1.0.1
#   git push && git push --tags
#
# Losse handmatige start kan ook, via het tabblad Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versie om te publiceren, bijv. v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  #  Controle vooraf: tag en package.json moeten hetzelfde zeggen
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # De release-tekst komt uit de COMMIT waar de tag op wijst. Bij een
          # handmatige start staat deze checkout op de branch en is die tag hier
          # helemaal niet opgehaald; met de standaard fetch-depth (1) zou de
          # volgende stap dan afbreken. 0 haalt alles op -- deze repo is 3,7 MB
          # en 72 commits, dus dat kost niets.
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          TAG_CLEAN="${TAG#v}"
          echo "package.json: $PKG"
          echo "tag:          $TAG_CLEAN"
          if [ "$PKG" != "$TAG_CLEAN" ]; then
            echo "::error::De tag ($TAG_CLEAN) komt niet overeen met de versie in package.json ($PKG)."
            echo "::error::Pas package.json aan of zet een andere tag. De updater vergelijkt op package.json."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      #  De release-tekst uit de commit halen
      # ----------------------------------------------------------------
      # De tags hier zijn annotated, maar hun bericht is EEN regel en zegt
      # minder dan de commit. Bij v1.24.2 staat in de tag "geen Electron in de
      # webbouw" en in de commit "de webbouw haalde honderd megabyte Electron
      # op die hij nooit gebruikt", met 27 regels toelichting eronder. Daarom
      # ^{commit} en niet de tag-annotatie.
      #
      # De commit-tekst wordt met git uitgelezen en NIET via ${{ }} in dit
      # script geplakt. Dat is geen netheid: acht van de vijftig commit-teksten
      # bevatten backticks, en die zouden bij inplakken als commando draaien.
      - id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          VERSIE: ${{ steps.v.outputs.version }}
        run: |
          KOP=$(git log -1 --format='%s' "${TAG}^{commit}")
          ROMP=$(git log -1 --format='%b' "${TAG}^{commit}")

          # "Versie 1.24.2: " van de kop af -- dat nummer staat al in de titel
          # en in de tag. Wat erachter staat blijft juist staan: dat is bij 48
          # van de 50 releases de enige samenvatting die er is, dus de hele
          # eerste regel weggooien zou de beste zin van de release weggooien.
          KOP=$(printf '%s' "$KOP" | sed -E 's/^[Vv]ersie[[:space:]]+[0-9]+(\.[0-9]+)*[[:space:]]*:[[:space:]]*//')
          # Stond er alleen "Versie 1.24.2" zonder tekst erachter, dan blijft er
          # niets over en laten we de kop weg in plaats van een lege ## te zetten.
          KOP=$(printf '%s' "$KOP" | sed -E 's/^[Vv]ersie[[:space:]]+[0-9]+(\.[0-9]+)*[[:space:]]*$//')

          # Alles vanaf een regel die met [intern] begint valt af. Zo kun je in
          # een commit iets kwijt dat wel in git hoort maar niet op een publieke
          # release. Staat er geen [intern], dan verandert deze regel niets.
          ROMP=$(printf '%s\n' "$ROMP" | sed -n '/^\[intern\]/q;p')

          # Trailers eraf: 47 van de 50 commits eindigen op Co-Authored-By en
          # dat is geen release-tekst.
          ROMP=$(printf '%s\n' "$ROMP" | sed -E '/^(co-authored-by|co-committed-by|signed-off-by|reviewed-by|acked-by|tested-by):[[:space:]]/Id')

          # Lege regels aan het eind weg.
          ROMP=$(printf '%s\n' "$ROMP" | sed -E ':a;/^[[:space:]]*$/{$d;N;ba}')

          # Willekeurig scheidingsteken: de tekst is vooraf onbekend, en een
          # vast "EOF" kan er letterlijk in staan.
          EIND="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<${EIND}"
            [ -n "$KOP" ] && printf '## %s\n\n' "$KOP"
            [ -n "$(printf '%s' "$ROMP" | tr -d '[:space:]')" ] && printf '%s\n\n' "$ROMP"
            echo "---"
            echo
            echo "### Downloaden"
            echo
            echo "**Windows** — pak \`Truckwash1-Dashboard-Setup-${VERSIE}.exe\`,"
            echo "dubbelklik en volg de installatie. Updates komen daarna vanzelf binnen."
            echo
            echo "**Android** — pak het \`.apk\`-bestand, zet het op je toestel en tik erop."
            echo "Sta eenmalig \"installeren uit onbekende bron\" toe."
            echo
            echo "**iOS** — nog niet beschikbaar; daarvoor is een Apple Developer-account nodig."
            echo
            echo "> Deze APK is ondertekend met de standaard ontwikkelsleutel. Prima om"
            echo "> te installeren en te gebruiken; voor de Play Store is een eigen"
            echo "> keystore nodig."
            echo "${EIND}"
          } >> "$GITHUB_OUTPUT"

          echo "Release-tekst voor ${TAG}:"
          echo "  kop:  ${KOP:-(geen -- alleen de downloadinstructies)}"
          echo "  romp: $(printf '%s' "$ROMP" | grep -c '' || true) regels"

  # ------------------------------------------------------------------
  #  Windows-installer
  # ------------------------------------------------------------------
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Supabase-instellingen klaarzetten
        shell: bash
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Zet de secrets VITE_SUPABASE_URL en VITE_SUPABASE_ANON_KEY in de repo-instellingen."
            echo "::error::Zonder die twee bouwt hij een app waarin niemand kan inloggen."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env

      - name: Bouwen en publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --publish always

  # ------------------------------------------------------------------
  #  Android-APK
  # ------------------------------------------------------------------
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencies installeren
        run: npm ci

      - name: Supabase-instellingen klaarzetten
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Zet de secrets VITE_SUPABASE_URL en VITE_SUPABASE_ANON_KEY in de repo-instellingen."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env

      - name: Versie in het Android-project zetten
        run: node scripts/sync-android-version.cjs

      - name: Webapp bouwen en synchroniseren
        run: npm run build && npx cap sync android

      # Het uitvoerrecht op gradlew overleeft een checkout vanaf Windows niet
      # altijd. Zonder dit recht stopt de bouw met code 126: bestand gevonden,
      # maar mag niet draaien.
      # De XML nakijken voordat Gradle eraan begint.
      #
      # Een verboden `--` in een XML-commentaar laat mergeResources omvallen
      # met een SAXParseException en een stapel Java eronder, na minuten
      # bouwen. Deze controle doet hetzelfde in een halve seconde en zegt in
      # welk bestand het zit.
      - name: XML van het Android-project nakijken
        run: python3 scripts/xml-nakijken.py

      - name: Gradle-wrapper uitvoerbaar maken
        run: chmod +x android/gradlew

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK een nette naam geven
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Truckwash1-Dashboard-${{ needs.check.outputs.version }}.apk"

      # De tekst komt uit de check-job. Hier mag ${{ }} wel: een `with:`-waarde
      # wordt als invoer doorgegeven en niet in een shell-script geplakt, dus
      # backticks in een commit-tekst kunnen hier niets uitrichten.
      - name: Aan de release hangen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Truckwash1 Dashboard ${{ needs.check.outputs.version }}
          draft: false
          files: out/*.apk
          body: ${{ needs.check.outputs.notes }}
