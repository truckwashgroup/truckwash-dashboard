appId: nl.truckwash1group.dashboard
productName: Truckwash1 Dashboard
copyright: Copyright © Truckwash1 Group

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  # Geen spaties in de bestandsnaam. De productnaam bevat er een, en GitHub
  # maakt daar bij het uploaden een punt van -- terwijl electron-builder in
  # latest.yml een streepje schrijft. Dan zoekt de updater een bestand dat niet
  # bestaat en mislukt de download zonder zichtbare fout.
  artifactName: Truckwash1-Dashboard-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Truckwash1 Dashboard

# Auto-update kanaal.
#
# De app kijkt bij het opstarten en elk half uur of er een nieuwere release op
# GitHub staat. Publiceren doe je met: npm run electron:publish
# (daarvoor heb je een GH_TOKEN nodig met "repo"-rechten).
#
# Belangrijk: verhoog eerst het version-veld in package.json. Daar vergelijkt
# de updater op.
publish:
  - provider: github
    owner: truckwashgroup
    repo: truckwash-dashboard
    releaseType: release
